spring.application.name=bloodbank

# ---- MySQL Datasource ----
spring.datasource.url=jdbc:mysql://localhost:3306/blood_bank?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

server.port=8080

# ---- Default admin account, created automatically on first startup ----
# ---On every app startup, it checks if a user with app.admin.email already exists.
# ---If not, it creates one with role ADMIN and the password from app.admin.password (BCrypt-encoded, same as any other user). 
app.admin.email=admin@lifedrop.com
app.admin.password=Admin@123

# ---- File uploads ----
app.upload.dir=uploads/requests
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
