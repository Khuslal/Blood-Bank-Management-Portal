<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Edit Centre - LifeDrop Blood Bank</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="container my-5" style="max-width:600px;">
		<h1 class="mb-4">Edit Centre</h1>

		<form th:action="@{/admin/centres/{id}(id=${centre.id})}" th:object="${centre}" method="post">
			<div class="mb-3">
				<label class="form-label">Centre Name</label>
				<input type="text" th:field="*{name}" class="form-control" required>
				<div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label">City</label>
				<input type="text" th:field="*{city}" class="form-control">
			</div>
			<div class="mb-3">
				<label class="form-label">Address</label>
				<input type="text" th:field="*{address}" class="form-control" required>
				<div class="text-danger small" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label">Contact Number</label>
				<input type="text" th:field="*{contactNumber}" class="form-control">
			</div>
			<div class="mb-3">
				<label class="form-label">Email</label>
				<input type="email" th:field="*{email}" class="form-control">
			</div>

			<button type="submit" class="btn btn-danger">Save Changes</button>
			<a th:href="@{/centres}" class="btn btn-outline-secondary">Cancel</a>
		</form>
	</div>
</body>

</html>
