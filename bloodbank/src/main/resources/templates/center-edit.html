<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Edit Center - LifeDrop Blood Bank</title>
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="container my-5" style="max-width:600px;">
		<h1 class="mb-4">Edit Center</h1>

		<form th:action="@{/admin/centers/{id}(id=${center.id})}" th:object="${center}" method="post">
			<div class="mb-3">
				<label class="form-label">Center Name</label>
				<input type="text" th:field="*{name}" class="form-control" required>
				<div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label">City</label>
				<input type="text" th:field="*{city}" class="form-control">
			</div>
			<div class="mb-3">
				<label class="form-label">Address</label>
				<input type="text" th:field="*{address}" class="form-control" required>
				<div class="text-danger small" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label">Contact Number</label>
				<input type="text" th:field="*{phone}" class="form-control">
			</div>
			<div class="mb-3">
				<label class="form-label">Email</label>
				<input type="email" th:field="*{email}" class="form-control">
			</div>

			<button type="submit" class="btn btn-danger">Save Changes</button>
			<a th:href="@{/centers}" class="btn btn-outline-secondary">Cancel</a>
		</form>
	</div>

	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
