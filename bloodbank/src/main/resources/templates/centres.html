<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Donation Centres - LifeDrop Blood Bank</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5">
    <h1 class="mb-4">Blood Donation Centres</h1>

    <!-- Admin-only: add a new centre -->
    <div class="card mb-5" sec:authorize="hasRole('ADMIN')">
        <div class="card-body">
            <h5 class="card-title">Add a New Centre</h5>
            <div class="alert alert-danger" th:if="${centreError}" th:text="${centreError}"></div>
            <form th:action="@{/admin/centres}" th:object="${newCentre}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Centre Name</label>
                        <input type="text" th:field="*{name}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">City</label>
                        <input type="text" th:field="*{city}" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Address</label>
                        <input type="text" th:field="*{address}" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Contact Number</label>
                        <input type="text" th:field="*{contactNumber}" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control">
                    </div>
                </div>
                <button type="submit" class="btn btn-danger mt-3">Add Centre</button>
            </form>
        </div>
    </div>

    <div class="alert alert-info" th:if="${centres == null or centres.isEmpty()}">
        No centres have been added yet.
    </div>

    <div class="row g-4">
        <div class="col-md-4" th:each="centre : ${centres}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${centre.name}">Centre Name</h5>
                    <p class="card-text mb-1" th:text="${centre.address}">Address</p>
                    <p class="card-text mb-1 text-muted" th:text="${centre.city}">City</p>
                    <p class="card-text mb-1" th:text="'📞 ' + ${centre.contactNumber}">Contact</p>
                    <p class="card-text" th:text="${centre.email}">Email</p>
					<a th:href="@{/admin/centres/{id}/edit(id=${centre.id})}"
					               class="btn btn-sm btn-outline-danger"
					               sec:authorize="hasRole('ADMIN')">Edit</a>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="text-center py-3 text-muted border-top mt-5">
    &copy; 2026 LifeDrop Blood Bank Management System
</footer>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
