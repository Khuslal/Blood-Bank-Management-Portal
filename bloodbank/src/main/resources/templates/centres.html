<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Donation Centres - LifeDrop Blood Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5">
    <h1 class="mb-4">Blood Donation Centres</h1>

    <div class="alert alert-info" th:if="${centres == null or centres.isEmpty()}">
        No centres have been added yet.
    </div>

    <div class="row g-4">
        <div class="col-md-4" th:each="centre : ${centres}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${centre.name}">Centre Name</h5>
                    <p class="card-text mb-1" th:text="${centre.address}">Address</p>
                    <p class="card-text mb-1 text-muted" th:text="${centre.city}">City</p>
                    <p class="card-text mb-1" th:text="'📞 ' + ${centre.contactNumber}">Contact</p>
                    <p class="card-text" th:text="${centre.email}">Email</p>
                </div>
            </div>
        </div>
    </div>
</div>

<footer class="text-center py-3 text-muted border-top mt-5">
    &copy; 2026 LifeDrop Blood Bank Management System
</footer>
</body>
</html>
