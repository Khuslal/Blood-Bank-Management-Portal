<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Schedule Blood Donation</title>

	<!-- Offline Bootstrap CSS -->
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body class="bg-light">
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="container py-5">

		<div class="row justify-content-center">

			<div class="col-lg-6 col-md-8">

				<div class="card shadow-lg border-0 rounded-4">

					<!-- Header -->

					<div class="card-header bg-danger text-white text-center py-4">

						<h2 class="mb-1">
							🩸 Schedule Blood Donation
						</h2>

						<p class="mb-0">
							Choose your preferred donation date and time.
						</p>

					</div>

					<!-- Body -->

					<div class="card-body p-4">

						<form id="donationForm" th:action="@{/donor/appointment}" method="post">

							<!-- Date -->

							<div class="mb-4">
								<p class="text-danger font-weight-bold" id="errorDetails" th:if="${errorMessage}">
									[[${errorMessage}]]</p>
								<p class="text-success font-weight-bold" id="successDetails" th:if="${successMessage}">
									[[${successMessage}]]</p>

								<label for="donationCenter">Select Donation Center</label>
								<select th:field="*{donationCenter}" name="donationCenter" class="form-control"
									required>
									<!-- Default placeholder option -->
									<option value="" disabled selected>Choose a Center</option>

									<!-- Dynamically loops over the centers from the database -->
									<option th:each="center : ${allCenters}" th:value="${center.id}"
										th:text="${center.name}">
										Center Name Placeholder
									</option>
								</select>


								<label class="form-label font-weight-bold">
									Donation Date
								</label>

								<input type="date" th:field="*{donationDate}" name="donationDate" class="form-control"
									required>

								<div class="form-text">
									Donation appointments are available Monday–Friday.
								</div>

							</div>

							<!-- Time -->

							<div class="mb-4">

								<label class="form-label font-weight-bold">
									Select Time Slot
								</label>

								<div class="row">

									<div class="col-6">

										<div class="form-check border rounded p-3">

											<input class="form-check-input" type="radio" th:field="*{timeSlot}"
												name="timeSlot" id="morning" value="09:00 AM - 12:00 PM" required>

											<label class="form-check-label fw-bold" for="morning">

												Morning

												<br>

												<small class="text-muted">
													09:00 AM - 12:00 PM
												</small>

											</label>

										</div>

									</div>

									<div class="col-6">

										<div class="form-check border rounded p-3">

											<input class="form-check-input" type="radio" th:field="*{timeSlot}"
												name="timeSlot" id="afternoon" value="01:00 PM - 04:00 PM" required>

											<label class="form-check-label fw-bold" for="afternoon">

												Afternoon

												<br>

												<small class="text-muted">
													01:00 PM - 04:00 PM
												</small>

											</label>

										</div>

									</div>

								</div>

							</div>

							<!-- Submit -->

							<div class="d-grid">

								<a href="/dashboard" class="btn btn-primary btn-lg">Back to Dashboard</a>
								<button class="btn btn-danger btn-lg" type="submit">

									Confirm Appointment

								</button>
							</div>

						</form>

					</div>

				</div>


			</div>

		</div>

	</div>

	<!-- Offline Bootstrap JS -->
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>

</html>
