<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Register - LifeDrop Blood Bank</title>
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="container my-5" style="max-width:520px;">
		<h1 class="mb-4 text-center">Create an Account</h1>

		<div class="alert alert-danger" th:if="${emailError}" th:text="${emailError}"></div>

		<form th:action="@{/register}" th:object="${user}" method="post">
			<div class="mb-3">
				<label class="form-label">First Name</label>
				<input type="text" th:field="*{firstName}" class="form-control" required>
				<div class="text-danger small" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
			</div>

			<div class="mb-3">
				<label class="form-label">Last Name</label>
				<input type="text" th:field="*{lastName}" class="form-control" required>
				<div class="text-danger small" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
			</div>

			<div class="mb-3">
				<label class="form-label">Date Of Birth</label>
				<input type="date" th:field="*{dob}" class="form-control" required>
				<div class="text-danger small" th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}"></div>
			</div>


			<div class="mb-3">
				<label class="form-label">Email</label>
				<input type="email" th:field="*{email}" class="form-control" required>
				<div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label">Password</label>
				<input type="password" th:field="*{password}" class="form-control" required>
				<div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
			</div>
			<div class="mb-3">
				<label class="form-label">Phone Number</label>
				<input type="text" th:field="*{phone}" class="form-control">
			</div>
			<div class="mb-3">
				<label class="form-label">Address</label>
				<input type="text" th:field="*{address}" class="form-control">
			</div>

			<div class="mb-3">
				<label class="form-label">Blood Group</label>
				<select th:field="*{bloodGroup}" class="form-select" required>
					<option value="" disabled>Select blood group</option>

					<!-- 2. Loops over the controller's bloodGroups model list -->
					<option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg.name().replace('_', ' ')}">
					</option>
				</select>
			</div>

			<div class="mb-3">
				<label class="form-label d-block">Gender</label>

				<div class="form-check form-check-inline">
					<input type="radio" id="genderMale" value="male" th:field="*{gender}" class="form-check-input"
						required>
					<label class="form-check-label" for="genderMale">Male</label>
				</div>

				<div class="form-check form-check-inline">
					<input type="radio" id="genderFemale" value="female" th:field="*{gender}" class="form-check-input"
						required>
					<label class="form-check-label" for="genderFemale">Female</label>
				</div>

				<div class="form-check form-check-inline">
					<input type="radio" id="genderCustom" value="custom" th:field="*{gender}" class="form-check-input"
						required>
					<label class="form-check-label" for="genderCustom">Custom</label>
				</div>

				<div class="text-danger small mt-1" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></div>
			</div>

			<button type="submit" class="btn btn-danger w-100">Register</button>
		</form>

		<p class="text-center mt-3">
			Already have an account? <a th:href="@{/login}">Login here</a>
		</p>
	</div>

	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
