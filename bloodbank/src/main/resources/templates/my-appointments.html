<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My Appointments</title>
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/bootstrap-icons/font/bootstrap-icons.css}">
</head>

<body class="bg-light">
	<div th:replace="~{fragments/navbar :: navbar}"></div>
	<div class="container py-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<div>
				<h2 class="fw-bold text-danger">
					<i class="bi bi-calendar-check-fill"></i>
					My Appointments
				</h2>
				<p class="text-muted">Your blood donation appointment history</p>
			</div>
			<a th:href="@{/donor/appointment}" class="btn btn-danger">
				<i class="bi bi-plus-circle"></i>
				Book New Appointment
			</a>
		</div>

		<div class="card shadow">
			<div class="card-header bg-danger text-white">
				<h5 class="mb-0">Appointment History</h5>
			</div>

			<div class="table-responsive">
				<table class="table table-hover table-bordered align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th>ID</th>
							<th>Center</th>
							<th>Donation Date</th>
							<th>Time Slot</th>
							<th>Status</th>
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(appointments)}">
							<td colspan="5" class="text-center py-4">
								You haven't booked any appointments yet.
							</td>
						</tr>

						<tr th:each="appointment : ${appointments}">
							<td th:text="${appointment.id}"></td>
							<td th:text="${appointment.center.name}"></td>
							<td th:text="${appointment.donationDate}"></td>
							<td th:text="${appointment.timeSlot}"></td>
							<td>
								<span class="badge bg-warning" th:if="${appointment.status.name()=='PENDING'}">
									Pending
								</span>
								<span class="badge bg-success" th:if="${appointment.status.name()=='ACCEPTED'}">
									Accepted
								</span>
								<span class="badge bg-danger" th:if="${appointment.status.name()=='REJECTED'}">
									Rejected
								</span>
								<span class="badge bg-primary" th:if="${appointment.status.name()=='DONATED'}">
									Donated
								</span>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
