<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Contact Us - LifeDrop Blood Bank</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="container my-5" style="max-width:600px;">
		<h1 class="mb-4">Contact Us</h1>

		<div class="alert alert-success" th:if="${submitted}">
			Thanks for reaching out — we'll get back to you soon.
		</div>

		<form th:action="@{/contact}" method="post">
			<div class="mb-3">
				<label class="form-label">Name</label>
				<input type="text" name="name" class="form-control" required>
			</div>
			<div class="mb-3">
				<label class="form-label">Email</label>
				<input type="email" name="email" class="form-control" required>
			</div>
			<div class="mb-3">
				<label class="form-label">Message</label>
				<textarea name="message" class="form-control" rows="4" required></textarea>
			</div>
			<button type="submit" class="btn btn-danger">Send Message</button>
		</form>
	</div>

	<footer class="text-center py-3 text-muted border-top mt-5">
		&copy; 2026 LifeDrop Blood Bank Management System
	</footer>
	<script th:src="@{/js/jquery-3.7.1.min.js}"></script>
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>

</html>
