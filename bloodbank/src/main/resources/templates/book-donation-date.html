<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Your Donation Date</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 antialiased text-slate-800">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        
        <!-- Header -->
        <div class="bg-indigo-600 p-6 text-white text-center">
            <h1 class="text-2xl font-bold tracking-tight">Book Donation</h1>
            <p class="text-indigo-100 text-sm mt-1">Choose your preferred date and time to drop off books.</p>
        </div>

        <!-- Form Body -->
        <form id="donationForm" class="p-6 space-y-6">
            
            <!-- Step 1: Donor Information -->
            <div class="space-y-4">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">1. Your Info</h2>
                <div>
                    <label for="fullName" class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                    <input type="text" id="fullName" required placeholder="John Doe"
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>
            </div>

            <!-- Step 2: Select Date -->
            <div class="space-y-4">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">2. Select Date</h2>
                <div>
                    <label for="donationDate" class="block text-sm font-medium text-slate-700 mb-1">Available Dates</label>
                    <input type="date" id="donationDate" required
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                    <span class="text-xs text-slate-400 mt-1 block">We accept drop-offs Monday through Friday.</span>
                </div>
            </div>

            <!-- Step 3: Select Time Slot -->
            <div class="space-y-4">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">3. Select Time</h2>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">Available Slots</label>
                    <div class="grid grid-cols-2 gap-3" id="timeSlotsGroup">
                        <label class="border border-slate-200 rounded-lg p-3 text-center cursor-pointer hover:bg-slate-50 transition block has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50">
                            <input type="radio" name="timeSlot" value="09:00 AM - 12:00 PM" required class="sr-only">
                            <span class="block text-sm font-medium text-slate-700">Morning</span>
                            <span class="block text-xs text-slate-500 mt-0.5">9 AM - 12 PM</span>
                        </label>
                        <label class="border border-slate-200 rounded-lg p-3 text-center cursor-pointer hover:bg-slate-50 transition block has-[:checked]:border-indigo-600 has-[:checked]:bg-indigo-50/50">
                            <input type="radio" name="timeSlot" value="01:00 PM - 04:00 PM" class="sr-only">
                            <span class="block text-sm font-medium text-slate-700">Afternoon</span>
                            <span class="block text-xs text-slate-500 mt-0.5">1 PM - 4 PM</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-4 rounded-lg shadow-md hover:shadow-lg transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                Confirm Booking
            </button>
        </form>

        <!-- Success Message Modal/Banner (Hidden by default) -->
        <div id="successBanner" class="hidden p-6 bg-emerald-50 border-t border-emerald-100 text-center animate-fade-in">
            <div class="w-12 h-12 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-3">
                <svg class="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h3 class="text-lg font-bold text-emerald-900">Appointment Booked!</h3>
            <p id="successDetails" class="text-sm text-emerald-700 mt-1"></p>
            <button onclick="window.location.reload()" class="mt-4 text-xs font-semibold text-emerald-800 underline hover:text-emerald-900">Book another date</button>
        </div>
    </div>

    <!-- Logic Setup -->
    <script>
        // Disallow picking past dates
        const dateInput = document.getElementById('donationDate');
        const today = new Date().toISOString().split('T')[0];
        dateInput.min = today;

        // Form submission handling
        document.getElementById('donationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('fullName').value;
            const date = document.getElementById('donationDate').value;
            const time = document.querySelector('input[name="timeSlot"]:checked').value;

            // Hide Form and Show Success Details
            document.getElementById('donationForm').classList.add('hidden');
            const banner = document.getElementById('successBanner');
            banner.classList.remove('hidden');
            
            document.getElementById('successDetails').innerText = `Thank you, ${name}! Your slot on ${date} during ${time} is confirmed.`;
        });
    </script>
</body>
</html>
