<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Request Blood - LifeDrop Blood Bank</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container my-5" style="max-width:600px;">
    <h1 class="mb-4">Request Blood</h1>

    <div class="alert alert-success" th:if="${submitted}">
        Your request has been submitted. Our team will review it shortly.
    </div>

    <form th:action="@{/request}" th:object="${bloodRequest}" method="post">
        <div class="mb-3">
            <label class="form-label">Patient Name</label>
            <input type="text" th:field="*{patientName}" class="form-control" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('patientName')}" th:errors="*{patientName}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Blood Group</label>
            <select th:field="*{bloodGroup}" class="form-select" required>
                <option value="">Select blood group</option>
                <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg.label}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Units Required</label>
            <input type="number" min="1" th:field="*{unitsRequired}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Hospital Name</label>
            <input type="text" th:field="*{hospitalName}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Contact Number</label>
            <input type="text" th:field="*{contactNumber}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Preferred Centre</label>
            <select name="centerId" class="form-select">
                <option value="">No preference</option>
                <option th:each="c : ${centres}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
        </div>
        <button type="submit" class="btn btn-danger w-100">Submit Request</button>
    </form>
</div>

<footer class="text-center py-3 text-muted border-top mt-5">
    &copy; 2026 LifeDrop Blood Bank Management System
</footer>
</body>
</html>
