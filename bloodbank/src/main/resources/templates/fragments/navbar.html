<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
	<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark" style="background-color:#b91c2b;">
		<div class="container">
			<a class="navbar-brand fw-bold" th:href="@{/}">🩸 LifeDrop Blood Bank</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navMenu">
				<ul class="navbar-nav ms-auto align-items-lg-center">
					<li class="nav-item"><a class="nav-link" th:href="@{/}">Home</a></li>
					<li class="nav-item" sec:authorize="hasRole('DONOR')">
						<a class="nav-link" th:href="@{/donor/appointment}">Appointment</a>
					</li>
					<li class="nav-item" sec:authorize="hasRole('ADMIN')">
						<a class="nav-link" th:href="@{/admin/appointments}">Appointments</a>
					</li>
					<li class="nav-item" sec:authorize="hasRole('CENTER_MANAGER')">
						<a class="nav-link" th:href="@{/centerManager/appointments}">Appointments</a>
					</li>
					<li class="nav-item"><a class="nav-link" th:href="@{/about}">About</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/centers}">Centers</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/stock}">Blood Stock</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/contact}">Contact</a></li>
					<li class="nav-item">
						<a class="nav-link" th:href="@{/request}">Request Blood</a>
					</li>
					<li class="nav-item" sec:authorize="isAuthenticated()">
						<a class="nav-link" th:href="@{/donation-history}">Donations</a>
					</li>
					<li class="nav-item" sec:authorize="isAuthenticated()">
						<a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
					</li>
					<li class="nav-item" sec:authorize="isAuthenticated()">
						<form th:action="@{/logout}" method="post" class="d-inline">
							<button type="submit" class="btn btn-light btn-sm ms-lg-2 mt-2 mt-lg-0">Logout</button>
						</form>
					</li>
					<li class="nav-item" sec:authorize="!isAuthenticated()">
						<a class="btn btn-light btn-sm ms-lg-2 mt-2 mt-lg-0" th:href="@{/login}">Login</a>
					</li>
					<li class="nav-item" sec:authorize="!isAuthenticated()">
						<a class="btn btn-outline-light btn-sm ms-lg-2 mt-2 mt-lg-0" th:href="@{/register}">Register</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>
</body>

</html>
